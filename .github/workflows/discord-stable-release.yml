name: Post stable release to Discord

on:
  workflow_dispatch:
  release:
    # "released" covers converting an existing prerelease to a full release.
    types: [published, released, edited]

permissions:
  contents: read

jobs:
  post-stable-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check that this release is marked Latest
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ github.event.release.id }}
        run: |
          latest_id=$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/latest" \
            | tee /tmp/latest-release.json \
            | jq -r '.id')
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] || [ "$latest_id" = "$RELEASE_ID" ]; then
            echo "is_latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_latest=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Post release and changelog
        if: steps.latest.outputs.is_latest == 'true'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_STABLE_RELEASE_WEBHOOK }}
        run: |
          payload=$(jq '
            (if (.name // "") != "" then .name else .tag_name end) as $release_title |
            {embeds:[{
              title:("TreeFrogUI " + $release_title + " released"),
              url:.html_url,
              description:((.body // "")[0:4000]),
              color:3066993,
              footer:{text:"Latest TreeFrogUI release"}
            }]}' /tmp/latest-release.json)
          curl --fail-with-body \
            -H 'Content-Type: application/json' \
            --data "$payload" \
            "$DISCORD_WEBHOOK_URL"
