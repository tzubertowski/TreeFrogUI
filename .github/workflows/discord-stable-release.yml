name: Post stable release to Discord

on:
  release:
    # Your lifecycle: publish as prerelease, then promote after testing.
    types: [released]

permissions:
  contents: read

jobs:
  post-stable-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check that this release is marked Latest
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ github.event.release.id }}
        run: |
          latest_id=$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/latest" \
            | tee /tmp/latest-release.json \
            | jq -r '.id')
          echo "latest_id=$latest_id" >> "$GITHUB_OUTPUT"
          if [ "$latest_id" = "$RELEASE_ID" ]; then
            echo "should_post=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_post=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check whether this Latest release was already posted
        if: steps.latest.outputs.should_post == 'true'
        id: posted
        uses: actions/cache/restore@v4
        with:
          path: /tmp/discord-latest-posted
          key: discord-latest-${{ steps.latest.outputs.latest_id }}

      - name: Post release and changelog
        if: steps.latest.outputs.should_post == 'true' && steps.posted.outputs.cache-hit != 'true'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_STABLE_RELEASE_WEBHOOK }}
        run: |
          payload=$(jq '
            (if (.name // "") != "" then .name else .tag_name end) as $release_title |
            {embeds:[{
              title:("TreeFrogUI " + $release_title + " released"),
              url:.html_url,
              description:((.body // "")[0:4000]),
              color:3066993,
              footer:{text:"Latest TreeFrogUI release"}
            }]}' /tmp/latest-release.json)
          curl --fail-with-body \
            -H 'Content-Type: application/json' \
            --data "$payload" \
            "$DISCORD_WEBHOOK_URL"
          mkdir -p /tmp/discord-latest-posted
          touch /tmp/discord-latest-posted/sent

      - name: Remember the posted Latest release
        if: steps.latest.outputs.should_post == 'true' && steps.posted.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /tmp/discord-latest-posted
          key: discord-latest-${{ steps.latest.outputs.latest_id }}
