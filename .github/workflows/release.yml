name: Build TreeFrogUI release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create (leave blank for build-only)
        required: false
        type: string
      prerelease:
        description: Mark the GitHub release as a prerelease
        required: true
        default: true
        type: boolean
  repository_dispatch:
    types: [release]

concurrency:
  group: treefrog-release
  cancel-in-progress: false

permissions:
  contents: write

env:
  # This archive is built and tested locally. CI only verifies, packages, and
  # publishes it; changing any of these values is a deliberate release action.
  LOCAL_BUNDLE_TAG: local-build-v1.6.0-o
  LOCAL_BUNDLE_ASSET: TreeFrogUI-local-build-v1.6.0-o.tar.gz
  LOCAL_BUNDLE_SHA256: f2df29875c74ada319cf355a156d5d13a0718fbad90886c30833da4e65c48b43
  # update.zip is always cumulative from the last major stable baseline.
  # Change this deliberately when the product moves to a new major baseline;
  # never replace it with the latest prerelease.
  LAST_MAJOR_UPDATE_BASE: v1.0.12
  LAST_MAJOR_UPDATE_ASSET: TreeFrogUI_v1.0.12_c.zip

jobs:
  build:
    name: Verify and package local build
    runs-on: ubuntu-latest
    steps:
      - name: Check out TreeFrogUI
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve build and release names
        id: names
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
          EVENT_NAME: ${{ github.event_name }}
          PUSH_TAG: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          if [[ -n "$INPUT_TAG" ]]; then
            tag="$INPUT_TAG"
          elif [[ "$EVENT_NAME" == push ]]; then
            tag="$PUSH_TAG"
          else
            tag=""
          fi
          if [[ -n "$tag" ]]; then
            version="$tag"
          else
            version="v0.0.0-ci.${RUN_NUMBER}"
          fi
          update_base="$LAST_MAJOR_UPDATE_BASE"
          [[ -n "$update_base" ]] || { echo 'update_base_tag is required for release builds' >&2; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "update_base=$update_base" >> "$GITHUB_OUTPUT"

      - name: Install packaging dependencies
        run: sudo apt-get update && sudo apt-get install --yes unzip zip jq p7zip-full

      - name: Download and verify local build bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/local-bundle"
          gh release download "$LOCAL_BUNDLE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "$LOCAL_BUNDLE_ASSET" --dir "$RUNNER_TEMP/local-bundle"
          echo "$LOCAL_BUNDLE_SHA256  $RUNNER_TEMP/local-bundle/$LOCAL_BUNDLE_ASSET" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/local-bundle/$LOCAL_BUNDLE_ASSET" -C "$RUNNER_TEMP/local-bundle"
          test -d "$RUNNER_TEMP/local-bundle/release"
          (
            cd "$RUNNER_TEMP/local-bundle/release"
            sha256sum -c ../SHA256SUMS
          )
          mkdir -p release/latest
          cp -a "$RUNNER_TEMP/local-bundle/release" release/latest/release

      - name: Download cumulative update base
        env:
          GH_TOKEN: ${{ github.token }}
          UPDATE_BASE_TAG: ${{ steps.names.outputs.update_base }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/update-base"
          gh release download "$UPDATE_BASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "$LAST_MAJOR_UPDATE_ASSET" --dir "$RUNNER_TEMP/update-base"

      - name: Sanity-check cores and resources
        run: |
          set -euo pipefail
          current=release/latest/release
          test -s "$current/cubegm/cores/j2me_libretro.so"
          test -s "$current/cubegm/cores/mcpe_libretro.so"
          test -s "$current/cubegm/cores/openclaw_libretro.so"
          test -s "$current/cubegm/bios/Roland_SC-55.sf2"
          echo '705d8af897d7c8b5ca968bd8171497fc0f4099e8c9c24b62a0acbdabb2ce3419  '"$current/cubegm/dsperate/dsperate" | sha256sum -c -
          required=(
            cubegm/picoarch cubegm/picoarch_hi
            cubegm/cores/frogui_libretro.so cubegm/cores/tyrquake_libretro.so
            cubegm/cores/classicube_libretro.so cubegm/cores/mcpe_libretro.so
            cubegm/cores/openclaw_libretro.so
            cubegm/ebook cubegm/dsperate/dsperate
            cubegm/lib/libSDL-1.2.so.0 cubegm/lib/libpng12.so.0
            cubegm/lib/libpng16.so.16
          )
          for rel in "${required[@]}"; do
            [[ -f "$current/$rel" ]] || { echo "Missing required payload: $rel" >&2; exit 1; }
          done
          echo "Release sanity check passed: $(find "$current/cubegm/cores" -name '*.so' | wc -l) cores; resources present."

      - name: Package full install and update
        id: package
        env:
          VERSION: ${{ steps.names.outputs.version }}
        run: |
          set -euo pipefail
          update_base_zip="$RUNNER_TEMP/update-base/$LAST_MAJOR_UPDATE_ASSET"
          test -f "$update_base_zip"
          TREEFROG_CUMULATIVE_UPDATE=1 ./pack_release.sh "$VERSION" "$update_base_zip"
          ./tests/test_release_base_selection.sh
          ./tests/test_offline_update.sh release/latest/update.zip "$update_base_zip"
          7z t "release/latest/TreeFrogUI_${VERSION}.zip" >/dev/null
          7z t release/latest/update.zip >/dev/null
          if [[ "$VERSION" == v0.0.0-ci.* ]]; then
            cp "release/latest/TreeFrogUI_${VERSION}.zip" "$RUNNER_TEMP/TreeFrogUI_build.zip"
            cp release/latest/update.zip "$RUNNER_TEMP/update_build.zip"
          else
            echo "full=release/latest/TreeFrogUI_${VERSION}.zip" >> "$GITHUB_OUTPUT"
            echo "update=release/latest/update.zip" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload build-only artifacts
        if: steps.names.outputs.tag == ''
        uses: actions/upload-artifact@v4
        with:
          name: TreeFrogUI-build-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/TreeFrogUI_build.zip
            ${{ runner.temp }}/update_build.zip
          if-no-files-found: error

      - name: Create GitHub release
        if: steps.names.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.names.outputs.tag }}
          VERSION: ${{ steps.names.outputs.version }}
          PRERELEASE: ${{ inputs.prerelease || 'true' }}
        run: |
          set -euo pipefail
          args=("$RELEASE_TAG" "release/latest/TreeFrogUI_${VERSION}.zip" "release/latest/update.zip" --repo "$GITHUB_REPOSITORY" --title "TreeFrogUI ${VERSION}" --notes-file release-notes.md)
          if [[ "$PRERELEASE" == true || "$RELEASE_TAG" == *-unstable* ]]; then args+=(--prerelease); fi
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "release/latest/TreeFrogUI_${VERSION}.zip" release/latest/update.zip --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "${args[@]}"
          fi

      - name: Post concise release update to Discord
        if: steps.names.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_GITHUB_UPDATES_WEBHOOK }}
          RELEASE_TAG: ${{ steps.names.outputs.tag }}
          VERSION: ${{ steps.names.outputs.version }}
        run: |
          set -euo pipefail

          releases=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100")
          previous_body=$(jq -r --arg tag "$RELEASE_TAG" '
            ([.[] | .tag_name] | index($tag)) as $index |
            if $index != null and .[$index + 1] then
              .[$index + 1].body // ""
            else
              ""
            end
          ' <<<"$releases")

          printf '%s\n' "$previous_body" > "$RUNNER_TEMP/previous-release-notes.md"
          diff -u "$RUNNER_TEMP/previous-release-notes.md" release-notes.md \
            > "$RUNNER_TEMP/release-notes.diff" || test $? -eq 1

          awk '
            !/^\+\+\+ / && /^\+/ {
              sub(/^\+/, "")
              if (NF && shown < 12) {
                print
                shown++
              }
            }
          ' "$RUNNER_TEMP/release-notes.diff" > "$RUNNER_TEMP/new-release-lines.md"

          if [[ ! -s "$RUNNER_TEMP/new-release-lines.md" ]]; then
            printf '%s\n' 'No new release-note lines; open the release for details.' \
              > "$RUNNER_TEMP/new-release-lines.md"
          fi

          release_url=$(jq -r --arg tag "$RELEASE_TAG" \
            '.[] | select(.tag_name == $tag) | .html_url' <<<"$releases")
          description=$(head -c 3800 "$RUNNER_TEMP/new-release-lines.md")
          payload=$(jq -n \
            --arg title "TreeFrogUI $VERSION" \
            --arg url "$release_url" \
            --arg description "$description" \
            '{embeds:[{title:$title,url:$url,description:$description,color:3066993,footer:{text:"New lines since the previous release"}}]}')

          curl --fail-with-body --silent --show-error \
            -H 'Content-Type: application/json' \
            --data "$payload" \
            "$DISCORD_WEBHOOK_URL"
